$kind: http-request
url: '{{base_url}}/reservations'
method: POST
headers:
  - key: Authorization
    value: '{{admin_access_token}}'
body:
  type: json
  content: |-
    {
        "guestId": "{{wt_guest_id}}",
        "bookingSource": "WalkIn",
        "assignments": [
            { "kuboId": "911e5b93-93d1-4a70-aa28-c2b5ebdbad5f", "checkInDate": "2099-01-10", "checkOutDate": "2099-01-12" }
        ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Reservation creation is Staff-only (403)', () => pm.response.to.have.status(403));
order: 3000
