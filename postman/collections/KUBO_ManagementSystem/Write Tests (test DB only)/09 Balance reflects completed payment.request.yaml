$kind: http-request
url: '{{base_url}}/reservations/{{wt_reservation_id}}'
method: GET
headers:
  - key: Authorization
    value: '{{staff_access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const r = pm.response.json().reservations || {};
      const start = Number(pm.collectionVariables.get('wt_balance'));
      pm.test('Net paid is 1000', () => pm.expect(Number(r.net_paid)).to.eql(1000));
      pm.test('Outstanding balance dropped by 1000', () => pm.expect(Number(r.outstanding_balance)).to.eql(start - 1000));
order: 9000
