$kind: http-request
url: '{{base_url}}/reservations/{{wt_reservation_id}}/kubos/911e5b93-93d1-4a70-aa28-c2b5ebdbad5f/late-check-out-fee'
method: POST
headers:
  - key: Authorization
    value: '{{staff_access_token}}'

scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Late fee on a Reserved kubo is rejected (400)', () => pm.response.to.have.status(400));
      pm.test('Error says the kubo must be CheckedIn', () => pm.expect(pm.response.json().message).to.match(/CheckedIn/));
order: 5300
