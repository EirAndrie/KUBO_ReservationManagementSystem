$kind: http-request
url: '{{base_url}}/reservations/{{wt_reservation_id}}'
method: DELETE
headers:
  - key: Authorization
    value: '{{staff_access_token}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get('wt_reservation_id')) pm.execution.skipRequest();
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Cleanup: reservation deleted (204)', () => pm.response.to.have.status(204));
order: 18000
