$kind: http-request
url: '{{base_url}}/reservations/{{wt_reservation_id}}/kubos/911e5b93-93d1-4a70-aa28-c2b5ebdbad5f/reassign'
method: PATCH
headers:
  - key: Authorization
    value: '{{staff_access_token}}'
body:
  type: json
  content: |-
    { "newKuboId": "{{wt_kubo2_id}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Staff can reassign a Reserved kubo (200)', () => pm.response.to.have.status(200));
      const a = pm.response.json().reservedKubos || {};
      pm.test('Assignment moved to the new kubo with the same dates', () => {
        pm.expect(a.kubo_id).to.eql(pm.collectionVariables.get('wt_kubo2_id'));
        pm.expect(a.check_in_date).to.eql('2099-01-10');
        pm.expect(a.check_out_date).to.eql('2099-01-12');
      });
order: 5600
